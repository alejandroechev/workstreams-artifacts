  return cl?`<span class="${cl}">${esc(s)}</span>`:esc(s);
 }).join('');
}

  }
  if(isCode){
   body+=`<label class="editor-label" for="code-input">${e.type==='fill'?'Your missing expression':'Your code'}</label><div class="code-window"><div class="code-title"><span>${e.type==='fill'?'FILL THE GAP':'EDITABLE · DRAFT SAVED LOCALLY'}</span><span>DEMO CHECK</span></div><textarea id="code-input" aria-label="${e.type==='fill'?'Missing expression':'Rust code editor'}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" rows="${e.type==='fill'?2:6}" placeholder="${esc(e.placeholder||'')}" ${feedback?.ok?'readonly':''}>${esc(state.drafts[e.id]??e.starter??'')}</textarea></div><div class="tokenbar" aria-label="Rust typing shortcuts">${['&','mut ','::','->','{','}','(',')',';'].map(t=>`<button data-token="${esc(t)}" ${feedback?.ok?'disabled':''}>${esc(t)}</button>`).join('')}</div>
   <p class="checker-note">Prototype checker: compares with a few known examples. <strong>No Rust is compiled or executed.</strong> Other valid solutions may not be recognized.</p>`;
   if(e.cases)body+=`<div class="test-cases"><div class="eyebrow">EXPECTED BEHAVIOR · NOT EXECUTED</div>${esc(e.cases).replace(/\n/g,'<br>')}</div>`;
  }
  if(hintOpen)body+=`<div class="hint">${esc(e.hint)}</div>`;
  if(feedback){
   body+=`<section class="feedback ${feedback.ok?'':'warn'}" role="status"><h3>${icon(feedback.ok?'check':'info')}${esc(feedback.title)}</h3><p>${esc(feedback.text)}</p>${feedback.ok&&isCode?'<p style="margin-top:9px;font-size:12px"><b>Example matched; compiler and runtime behavior are unverified.</b></p>':''}</section>`;
   if(feedback.ok||isQuiz)body+=`<p class="small muted" style="margin-top:22px">How does this idea feel?</p><div class="rating"><button class="secondary" data-rate="again">${icon('repeat')}Revisit soon</button><button class="primary" data-rate="good">Got the idea ${icon('arrow')}</button></div><p class="small muted" style="text-align:center;margin-top:10px">“Revisit soon” schedules 10 minutes; “Got it” schedules tomorrow.</p>`;
   else body+=`<div class="exercise-actions"><button class="secondary" data-action="example">Use an example</button><button class="primary" data-action="check">Check again ${icon('arrow')}</button></div>`;
  }else body+=`<div class="exercise-actions"><button class="secondary" data-action="hint">${icon('lesson')}Hint</button><button class="primary" data-action="check" ${isQuiz&&selected===null?'disabled':''}>${isCode?'Check example':'Check answer'} ${icon('arrow')}</button></div>`;
  body+=`<div class="subactions">${isCode?'<button class="text-button" data-action="example">Show an example</button>':'<span></span>'}<button class="text-button" data-action="skip">Skip for now</button></div>`;
 }
 return `<main class="exercise-shell fade-in" tabindex="-1"><header class="exercise-header"><button class="icon-button" data-action="exit" aria-label="Save and exit session">${icon('close')}</button><div><div class="row between"><span class="eyebrow muted">A LITTLE PRACTICE</span><span class="small muted">${session.index+1} / ${session.ids.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${session.index/session.ids.length*100}%"></div></div></div><button class="icon-button" data-action="bookmark" aria-label="${bookmarked?'Remove bookmark':'Bookmark experience'}" aria-pressed="${bookmarked}" style="${bookmarked?'color:var(--rust);background:var(--rust-light)':''}">${icon('bookmark')}</button></header><div class="row between"><span class="pill ${e.type==='lesson'?'green':'rust'}">${icon(e.type)}${formats[e.type][0]}</span><span class="small muted">${esc(e.topic)} · ${e.time}</span></div><section class="exercise-heading"><h1>${esc(e.title)}</h1><p>${esc(e.prompt)}</p></section>${body}</main>`;
}
function check(){
 const e=current(),isCode=['write','fix','fill'].includes(e.type);
 if(isCode){
  const value=state.drafts[e.id]??e.starter??'';
  const normalize=s=>s.trim().replace(/\s+/g,'');
  const ok=e.samples.some(s=>normalize(s)===normalize(value));
  feedback=ok?{ok:true,title:'Matches a known example',text:e.why}:{ok:false,title:value.trim()?'Not evaluated — not necessarily wrong':'Your turn to write a little Rust',text:value.trim()?'This prototype cannot compile your answer. It does not match the small set of examples built into this card. Your solution may still be valid. Edit it, or inspect a known example.':'Write your answer above, or use a hint. The checker only recognizes a few example solutions.'};
 }else{
  if(selected===null)return;
  feedback={ok:selected===e.answer,title:selected===e.answer?'Exactly. Here’s why.':'A useful surprise.',text:e.why};
 }
 render();
 document.querySelector('.feedback')?.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function advance(rating){
 if(rating){
  const e=current(),old=state.progress[e.id]||{};
  state.progress[e.id]={...old,practiced:true,visits:(old.visits||0)+1,due:Date.now()+(rating==='again'?600000:86400000),lastPracticed:Date.now(),verification:['write','fill','fix'].includes(e.type)?'example-only':'authored-answer'};
  session.completed=(session.completed||0)+1;
 }
 session.index++;
 selected=null;feedback=null;hintOpen=false;slide=0;
 if(session.index>=session.ids.length){session.summary=true;state.active=null;}else state.active={...session};
 save();render(true);
}
function summary(){
 return `<main class="exercise-shell summary fade-in" tabindex="-1"><div class="stamp">${icon('leaf')}</div><div class="eyebrow muted">A SMALL STEP IS STILL A STEP</div><h1>${session.completed?'A little more Rust.':'Back when you’re ready.'}</h1><p>${session.completed?'You made space for something new. That’s enough for today.':'No pressure. The cards are on your shelf whenever you feel curious.'}</p><span class="pill green">${session.completed||0} ${session.completed===1?'experience':'experiences'} practiced</span><div class="card"><span class="eyebrow muted">TAKE IT WITH YOU</span><p>${session.completed?'Your practiced cards now live in Notebook, with one takeaway each and a time to revisit.':'Skipping does not mark a card as practiced or change your progress.'}</p><p class="small muted">Code checks in this prototype match examples, not compiled programs.</p></div><button class="primary full" data-action="finish">That’s enough for now ${icon('check')}</button><button class="secondary full" data-action="more">Explore one more</button><button class="text-button" data-action="feedback">A thought about this experience?</button></main>`;
}
function openModal(title,body){
 const modal=document.getElementById('modal');
 modal.innerHTML=`<div class="dialog-heading"><h2 id="modal-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-body">${body}</div>`;
 modal.showModal();
}
function about(){
 openModal('A small mock. A real direction.',`<span class="pill rust">INTERACTIVE CONCEPT · NOT A NATIVE APP</span>
 <p>Explore five formats: read code, write from scratch, fill a gap, debug, and mini lessons. Drafts, practice, bookmarks, and added packs stay in this browser.</p>
 <h3>What’s real here</h3><p>Navigation, authored quiz answers, editable code, hints, saved drafts, a simple review schedule, pack installation, and feedback export.</p>
 <h3>What’s deliberately simulated</h3><p>Code checking compares text with known examples. There is no compiler, sandbox, test runner, AI tutor, cross-device sync, or installed-app offline cache. Nothing you type is uploaded. An already-open page works without a connection; a fresh offline visit is not guaranteed.</p>
 <h3>The production direction</h3><p>Tauri 2 + React/TypeScript. Automerge documents persisted in IndexedDB, with optional background sync. Store attempts separately from versioned content packs so updating lessons never resets progress.</p>
 <h3>Rust execution needs its own design</h3><ul><li><b>Tauri is not a Rust playground.</b> Its compiled backend does not include rustc. Arbitrary learner code needs a separate toolchain and isolated runner.</li><li><b>On phones:</b> start with offline lessons and quizzes; queue code checks for an opt-in remote runner or a paired desktop. Never show “passed” while a check is pending.</li><li><b>On desktop:</b> a local installed toolchain is viable, but compile and run untrusted code outside the app’s privileges. Time, memory, processes, filesystem, and network all need limits.</li><li><b>WebAssembly:</b> can execute compiled modules, but does not compile Rust source by itself. Target support differs; filesystem, threads, and many runtime-dependent crates need extra work.</li><li><b>Correctness:</b> compilation is just one gate. Use hidden behavior tests, edge cases, timeouts, and compile-fail tests. Valid solutions must not be reduced to string matches. Tests are evidence, not a proof of all behavior.</li><li><b>Crates:</b> pin toolchains, editions, and allowed dependencies. Build scripts and procedural macros execute during compilation, so compilation needs isolation too.</li></ul>
 <h3>Growing the curriculum</h3><p>Versioned packs should carry stable exercise IDs, prerequisites, learning goals, reference answers, harnesses, hints, and toolchain/crate versions. Run every exercise in CI. Keep introductory moments short, but connect them to deeper practice so pattern recognition does not masquerade as understanding.</p>
 <h3>Phone-specific rough edges</h3><p>Punctuation-heavy typing, soft keyboards, selection, and compiler diagnostics need real-device testing. Favor tiny editable regions and optional token keys. This responsive mock approximates the layout; native keyboard, safe-area, and app lifecycle behavior still need a Tauri build.</p>
 <h3>Platform distribution</h3><p>On-device compilation and dynamically executed code also need platform and app-store review. Educational exceptions can exist; they are not blanket approval. Validate the intended Android and iOS distribution separately.</p>
 <p class="small">References: <a href="https://v2.tauri.app/start/" target="_blank" rel="noopener">Tauri 2</a> · <a href="https://doc.rust-lang.org/cargo/reference/build-scripts.html" target="_blank" rel="noopener">Cargo build scripts</a> · <a href="https://doc.rust-lang.org/rustc/platform-support/wasm32-unknown-unknown.html" target="_blank" rel="noopener">Rust’s WebAssembly target</a> · <a href="https://developer.apple.com/app-store/review/guidelines/#software-requirements" target="_blank" rel="noopener">App Store guidelines</a></p>`);
}
function feedbackModal(){openModal('Leave a pocket note.',`<p>What should stay? What felt awkward on your phone?</p><label for="feedback-input">Your feedback (saved locally, not sent)</label><textarea id="feedback-input" placeholder="I liked… / I got stuck when…">${esc(state.feedback||'')}</textarea><button class="primary full" data-action="save-feedback">Save note ${icon('check')}</button><button class="text-button full" data-action="export">Download progress & feedback</button>`);}
function exportData(){
 const data={app:'Rust Pocket prototype',exportedAt:new Date().toISOString(),feedback:state.feedback,topics:state.topics,packs:state.packs,progress:state.progress,bookmarks:state.bookmarks,drafts:state.drafts};
 const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download='rust-pocket-feedback.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
 toast('Export downloaded. Share it when you’re ready.');
}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.nav){page=b.dataset.nav;session=null;render(true);return;}
 if(b.dataset.minutes){state.minutes=Number(b.dataset.minutes);save();render();return;}
 if(b.dataset.format){page='explore';filter=b.dataset.format;search='';render(true);return;}
 if(b.dataset.filter){filter=b.dataset.filter;render();return;}
 if(b.dataset.start){start([b.dataset.start]);return;}
 if(b.dataset.pack){state.packs.push(b.dataset.pack);save();render();toast('Two new experiences added to your shelf.');return;}
 if(b.dataset.removeTopic!==undefined){state.topics.splice(Number(b.dataset.removeTopic),1);save();render();return;}
 if(b.dataset.option!==undefined){selected=Number(b.dataset.option);render();return;}
 if(b.dataset.rate){advance(b.dataset.rate);return;}
 if(b.dataset.token!==undefined){
  const input=document.getElementById('code-input');if(!input||input.readOnly)return;
  const from=input.selectionStart,to=input.selectionEnd;
  input.setRangeText(b.dataset.token,from,to,'end');input.focus();state.drafts[current().id]=input.value;save();return;
 }
 switch(b.dataset.action){
  case 'about':about();break;
  case 'close-modal':document.getElementById('modal').close();break;
  case 'daily':start(['move','borrow','mut','even','option'].slice(0,state.minutes===2?1:state.minutes===5?3:5));break;
  case 'resume':start(null,true);break;
  case 'browse':page='explore';filter='All';search='';render(true);break;
  case 'review':start(due().map(e=>e.id));break;
  case 'exit':state.active={...session};save();session=null;page='today';render(true);break;
  case 'bookmark':{const id=current().id;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];save();render();break;}
  case 'hint':hintOpen=!hintOpen;render();break;
  case 'check':check();break;
  case 'next-slide':slide++;render(true);break;
  case 'previous-slide':slide--;render(true);break;
  case 'skip':advance(null);break;
  case 'example':state.drafts[current().id]=current().reference;feedback=null;save();render();toast('Example inserted. Read it, then check it.');break;
  case 'finish':session=null;page='today';render(true);break;
  case 'more':session=null;page='explore';filter='All';search='';render(true);break;
  case 'feedback':feedbackModal();break;
  case 'save-feedback':state.feedback=document.getElementById('feedback-input').value;save();document.getElementById('modal').close();toast('Note saved on this browser. Nothing was sent.');break;
  case 'export':exportData();break;
 }
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='search'){search=el.value;document.getElementById('exercise-results').innerHTML=results();}
 if(el.id==='code-input'){state.drafts[current().id]=el.value;save();}
 if(el.id==='feedback-input'){state.feedback=el.value;save();}
});
document.addEventListener('submit',event=>{
 if(event.target.id!=='topic-form')return;event.preventDefault();
 const value=document.getElementById('topic-input').value.trim();if(!value)return;
 if(!state.topics.some(t=>t.toLowerCase()===value.toLowerCase()))state.topics.push(value);
 save();render();toast('Added to your topic wishlist.');
});
document.addEventListener('keydown',event=>{
 if(event.target.id==='code-input'&&event.key==='Tab'&&!event.shiftKey){event.preventDefault();const el=event.target;el.setRangeText('    ',el.selectionStart,el.selectionEnd,'end');state.drafts[current().id]=el.value;save();}
});
save();render();
</script>
</body>
